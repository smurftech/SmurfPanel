[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcpanel"
version = "0.1.0"
description = "Low-latency controller for a PCPanel USB mixer"
requires-python = ">=3.11"
dependencies = [
  "pyusb>=1.2.1",
  "PySide6>=6.8.0",
  "pulsectl>=24.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]
build = [
  "pyinstaller>=6.0",
]

[project.scripts]
pcpanel = "pcpanel.__main__:main"
pcpanel-gui = "pcpanel.gui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
